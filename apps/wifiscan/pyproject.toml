[project]
name = "wifiscan"
version = "0.1.0"
description = "One-shot CLI to list nearby Wi-Fi access points (SSID, BSSID, channel, RSSI, security)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wifiscan = "wifiscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wifiscan"]
